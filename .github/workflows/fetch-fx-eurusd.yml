name: Fetch FX EURUSD

# EURUSD alone. The four-symbol run lost this one to a release-creation race:
# all four jobs tried to create the same tag at the same instant and the loser
# aborted before downloading anything. The tag now exists, so a solo re-run has
# nothing to race against.
on:
  push:
    branches: [claude/hello-vc2ivo]
    paths: ["research/.eur_trigger"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with: { ref: claude/hello-vc2ivo }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install tick-vault pandas pyarrow
      - name: Ensure release
        continue-on-error: true
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: gh release view fx-ticks-raw || gh release create fx-ticks-raw -t "FX ticks (bid/ask)" -n "Dukascopy tick data"
      - name: Download EURUSD
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          python - <<'PY'
          import asyncio, datetime as dt, os, glob, subprocess
          os.environ["TICK_VAULT_DATA_DIR"] = "fxdata"
          import tick_vault as tv
          end = dt.datetime(2026, 8, 1, tzinfo=dt.timezone.utc)
          for m in range(12):
              s = (end - dt.timedelta(days=30 * (m + 1))).replace(
                  day=1, hour=0, minute=0, second=0, microsecond=0)
              e = (s + dt.timedelta(days=32)).replace(day=1)
              tag = s.strftime("%Y%m")
              out = f"EURUSD_{tag}.parquet"
              try:
                  asyncio.run(tv.download_range("EURUSD", s, e))
                  df = tv.read_tick_data("EURUSD", s, e, show_progress=False)
                  if df is None or not len(df):
                      print(f"{tag}: empty"); continue
                  df.to_parquet(out, compression="zstd", index=False)
                  print(f"{tag}: {len(df):,} ticks", flush=True)
                  subprocess.run(["gh", "release", "upload", "fx-ticks-raw",
                                  out, "--clobber"], check=False)
                  os.remove(out)
              except Exception as ex:
                  print(f"{tag}: {ex}", flush=True)
          PY
