name: Download Cross-Asset 1m
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release view xasset-1m || gh release create xasset-1m -t "Cross-asset bars" -n "ES/ZB/GC 1-second + VIX 1-minute, front-month stitched"
  download:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        product: [ES, ZB, GC, VIX]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pandas pyarrow
      - name: Download ${{ matrix.product }}
        env:
          POLYGON_API: ${{ secrets.POLYGON_API }}
          PRODUCT: ${{ matrix.product }}
        run: python -m research.download_xasset
      - name: Upload ${{ matrix.product }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload xasset-1m data/xasset/${{ matrix.product }}_*.parquet --clobber
