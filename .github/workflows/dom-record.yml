name: Record live order book

# Depth is free with the Tradovate account but has no history, so it has to be
# recorded. Runs on GitHub because the research container cannot reach
# tradovateapi.com. Each session commits a parquet and appends the measured
# latency to research/DOM.md.
on:
  schedule:
    - cron: '25 13 * * 1-5'        # 13:25 UTC, just before the US cash open
  push:
    branches: [claude/hello-vc2ivo, claude/transfer-trading-bot-GiNxs]
    paths: ['data/dom/.trigger']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install pandas pyarrow requests websocket-client
      - name: Record
        env:
          TRADOVATE_USER: ${{ secrets.TRADOVATE_USER }}
          TRADOVATE_PASS: ${{ secrets.TRADOVATE_PASS }}
          TRADOVATE_CID:  ${{ secrets.TRADOVATE_CID }}
          TRADOVATE_SEC:  ${{ secrets.TRADOVATE_SEC }}
          DUR_MIN: ${{ vars.DOM_MINUTES || '300' }}
        run: |
          if [ -z "$TRADOVATE_USER" ]; then
            echo "::error::Tradovate secrets missing. Settings -> Secrets and"
            echo "::error::variables -> Actions: TRADOVATE_USER, _PASS, _CID, _SEC"
            exit 1
          fi
          python research/mining_2026_07_31/mega2/dom_record.py
      - name: Commit
        if: always()
        run: |
          git config user.name "dom-bot"; git config user.email "noreply@github.com"
          git add data/dom research/DOM.md 2>/dev/null || true
          git diff --staged --quiet || git commit -m "data: order book session"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push origin HEAD:${{ github.ref_name }}
