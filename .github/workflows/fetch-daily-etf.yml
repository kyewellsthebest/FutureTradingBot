name: Fetch Daily ETF History

# The CBOE put/call archives run 2006-2019 and our NQ futures data starts in
# December 2023, so they do not overlap at all. QQQ tracks NQ closely and
# Polygon has it back to 1999, which turns a dead test into a 13-year one.
on:
  push:
    branches: [claude/hello-vc2ivo]
    paths: ["research/.etf_trigger"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { ref: claude/hello-vc2ivo }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pandas
      - env:
          POLYGON_API: ${{ secrets.POLYGON_API }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request, urllib.error
          import pandas as pd
          KEY = os.environ["POLYGON_API"]
          os.makedirs("data/polygon", exist_ok=True)
          for sym in ("QQQ", "SPY"):
              rows, url = [], (
                  f"https://api.polygon.io/v2/aggs/ticker/{sym}/range/1/day/"
                  f"2004-01-01/2026-08-04?adjusted=true&sort=asc&limit=50000")
              while url:
                  try:
                      req = urllib.request.Request(
                          url + (f"&apiKey={KEY}" if "apiKey" not in url else ""),
                          headers={"User-Agent": "fetch/1.0"})
                      with urllib.request.urlopen(req, timeout=60) as r:
                          d = json.loads(r.read().decode())
                  except urllib.error.HTTPError as e:
                      print(f"{sym}: HTTP {e.code}"); break
                  rows += d.get("results", [])
                  url = d.get("next_url")
                  if url: url += f"&apiKey={KEY}"; time.sleep(0.2)
              if not rows:
                  print(f"{sym}: nothing"); continue
              f = pd.DataFrame(rows)
              f["date"] = pd.to_datetime(f.t, unit="ms").dt.date
              f = f[["date", "o", "h", "l", "c", "v"]]
              f.columns = ["date", "open", "high", "low", "close", "volume"]
              f.to_csv(f"data/polygon/{sym}_daily.csv", index=False)
              print(f"{sym}: {len(f):,} days {f.date.min()} -> {f.date.max()}")
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/polygon/*_daily.csv
          git diff --staged --quiet || (git commit -m "Daily QQQ/SPY history for the positioning study" &&
            for i in 1 2 3 4; do git pull --rebase -X ours origin claude/hello-vc2ivo && git push origin claude/hello-vc2ivo && break || sleep $((2**i)); done)
