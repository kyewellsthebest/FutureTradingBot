name: Fetch Positioning Data

# The execution container's proxy 403s cboe.com and stooq, and Polygon's plan
# caps stock history at two years -- so QQQ came back 2024-2026 while the CBOE
# put/call archives end in 2019, and the two never met. Actions runners have
# open internet, which is the whole reason this workflow exists.
on:
  push:
    branches: [claude/hello-vc2ivo]
    paths: ["research/.pos_trigger"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { ref: claude/hello-vc2ivo }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pandas
      - name: Pull long histories
        env:
          POLYGON_API: ${{ secrets.POLYGON_API }}
        run: |
          mkdir -p data/positioning
          # CBOE publishes these free and they run to the present day
          for f in VIX_History SKEW_History VVIX_History; do
            curl -sSLf --max-time 90 -A "Mozilla/5.0" \
              "https://cdn.cboe.com/api/global/us_indices/daily_prices/$f.csv" \
              -o "data/positioning/$f.csv" && echo "got $f" || echo "MISS $f"
          done
          # Index prices, several sources because each fails differently:
          # stooq answers a JavaScript challenge instead of CSV, Yahoo 403s,
          # and Polygon's plan caps STOCKS at two years. VIX without a price
          # series is useless, so try them all and report which landed.
          curl -sSLf --max-time 90 -A "Mozilla/5.0" \
            "https://fred.stlouisfed.org/graph/fredgraph.csv?id=SP500" \
            -o data/positioning/fred_sp500.csv && echo "got FRED SP500" || echo "MISS fred"
          curl -sSLf --max-time 90 -A "Mozilla/5.0" \
            "https://fred.stlouisfed.org/graph/fredgraph.csv?id=NASDAQCOM" \
            -o data/positioning/fred_nasdaq.csv && echo "got FRED NASDAQ" || echo "MISS fred_nq"
          for s in qqq.us spy.us; do
            curl -sSLf --max-time 90 -A "Mozilla/5.0" -H "Accept: text/csv" \
              "https://stooq.com/q/d/l/?s=$s&i=d" \
              -o "data/positioning/${s%%.*}_stooq.csv" && echo "tried $s" || echo "MISS $s"
          done
          # Polygon INDEX aggregates are a different entitlement from stocks
          python - <<'PYX'
          import json, os, urllib.request, pandas as pd
          KEY = os.environ.get("POLYGON_API", "")
          for sym, out in (("I:SPX", "poly_spx"), ("I:NDX", "poly_ndx")):
              try:
                  u = (f"https://api.polygon.io/v2/aggs/ticker/{sym}/range/1/day/"
                       f"2004-01-01/2026-08-04?adjusted=true&sort=asc&limit=50000"
                       f"&apiKey={KEY}")
                  with urllib.request.urlopen(u, timeout=60) as r:
                      d = json.loads(r.read().decode())
                  rs = d.get("results", [])
                  if rs:
                      f = pd.DataFrame(rs)
                      f["date"] = pd.to_datetime(f.t, unit="ms").dt.date
                      f[["date", "c"]].rename(columns={"c": "close"}).to_csv(
                          f"data/positioning/{out}.csv", index=False)
                      print(f"got {sym}: {len(f):,} rows {f.date.min()} -> {f.date.max()}")
                  else:
                      print(f"MISS {sym}: empty")
              except Exception as e:
                  print(f"MISS {sym}: {e}")
          PYX
          for f in data/positioning/*.csv; do
            echo "$f: $(wc -l < "$f") rows, $(head -2 "$f" | tail -1 | cut -c1-30)"
          done
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/positioning
          git diff --staged --quiet || (git commit -m "Positioning data: CBOE indices and long index history" &&
            for i in 1 2 3 4; do git pull --rebase -X ours origin claude/hello-vc2ivo && git push origin claude/hello-vc2ivo && break || sleep $((2**i)); done)
