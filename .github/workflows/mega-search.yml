name: MEGA Strategy Search

# Runs the MEGA2 honest strategy search on GitHub's servers so it proceeds
# 24/7 regardless of whether the research sandbox is awake. One job per
# market (wide pass, ~54M configs) plus sharded deep-pass jobs for the
# rates markets (~440M configs each). A final collect job commits all
# results to research/mining_2026_07_31/mega2/actions_results/.
#
# Fires when research/mining_2026_07_31/mega2/.search_trigger changes,
# or manually from the Actions tab.

on:
  push:
    branches: [claude/hello-vc2ivo]
    paths:
      - "research/mining_2026_07_31/mega2/.search_trigger"
  workflow_dispatch:

permissions:
  contents: write

env:
  M2DIR: research/mining_2026_07_31/mega2

jobs:
  wide:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        market: [CL, NG, HG, 6E, 6B, 6A, 6J, MBT, ETH, ZC, ZW, ZS, HO, RB, ZF]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/hello-vc2ivo
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pandas
      - name: Wide search ${{ matrix.market }}
        env:
          M2_DEPTH: "2"
          M2_REPO: ${{ github.workspace }}
        run: |
          cd $M2DIR
          python stage1b.py ${{ matrix.market }}
      - uses: actions/upload-artifact@v4
        with:
          name: wide-${{ matrix.market }}
          path: |
            ${{ env.M2DIR }}/s1b_${{ matrix.market }}.json.gz
            ${{ env.M2DIR }}/s1bbase_${{ matrix.market }}.npz

  deep:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        market: [ZB, ZN]
        shard: ["0/3", "1/3", "2/3"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/hello-vc2ivo
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pandas
      - name: Deep search ${{ matrix.market }} shard ${{ matrix.shard }}
        env:
          M2_DEPTH: "3"
          M2_SHARD: ${{ matrix.shard }}
          M2_REPO: ${{ github.workspace }}
        run: |
          cd $M2DIR
          python stage1b.py ${{ matrix.market }}
      - uses: actions/upload-artifact@v4
        with:
          name: deep-${{ matrix.market }}-${{ strategy.job-index }}
          path: |
            ${{ env.M2DIR }}/s1dsh*_${{ matrix.market }}.json.gz
            ${{ env.M2DIR }}/s1dsh*base_${{ matrix.market }}.npz

  collect:
    needs: [wide, deep]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/hello-vc2ivo
      - uses: actions/download-artifact@v4
        with:
          path: research/mining_2026_07_31/mega2/actions_results
          merge-multiple: true
      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add research/mining_2026_07_31/mega2/actions_results
          if git diff --staged --quiet; then
            echo "no results to commit"
          else
            git commit -m "MEGA search results from GitHub Actions"
            git pull --rebase origin claude/hello-vc2ivo || true
            git push origin claude/hello-vc2ivo
          fi
