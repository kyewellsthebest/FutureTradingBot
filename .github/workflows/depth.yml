name: Databento depth data

# Two-stage: cost check (free) always runs; the buy stage only runs when
# data/depth/.buy contains a plan line, so nothing is purchased until the
# printed costs have been reviewed.
on:
  push:
    branches: [claude/hello-vc2ivo]
    paths: ['data/depth/.probe', 'data/depth/.buy', 'data/depth/.pilot']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  depth:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install databento pandas pyarrow
      - name: swap (mbo days OOM-killed the first runner)
        run: |
          sudo fallocate -l 8G /mnt/swap2 && sudo chmod 600 /mnt/swap2
          sudo mkswap /mnt/swap2 && sudo swapon /mnt/swap2
      - name: cost check (free)
        env:
          DATABENTO_KEY: ${{ secrets.DATABENTO_KEY }}
        run: python research/mining_2026_07_31/mega2/depth_cost.py
      - name: buy top-of-book and reduce to a 1s tape (only if staged)
        if: hashFiles('data/depth/.buy') != ''
        # Deliberately below the job's 300, so an overrun fails THIS step
        # and still lets the commit step run. A job-level timeout kills
        # the whole job, `if: always()` included, and every downloaded
        # day would be lost -- bytes Databento has already charged for
        # and would charge for again.
        timeout-minutes: 240
        env:
          DATABENTO_KEY: ${{ secrets.DATABENTO_KEY }}
          # The credit is ~$48 with no real money behind it. This cap is
          # the entire safety story, so it is set here explicitly rather
          # than left to a default in the script. The staged plan priced
          # at $32.51 on the free endpoint, so 35 is just enough headroom
          # for a small price drift and not enough for a mistake.
          MAX_SPEND: '35'
        run: python research/mining_2026_07_31/mega2/depth_buy_book.py
      - name: book-feature pilot (only if staged)
        if: hashFiles('data/depth/.pilot') != ''
        env:
          DATABENTO_KEY: ${{ secrets.DATABENTO_KEY }}
        run: python research/mining_2026_07_31/mega2/depth_pilot.py
      - name: commit derived results
        if: always()
        run: |
          git config user.name "Claude" && git config user.email "noreply@anthropic.com"
          git add -A data/depth research/DEPTH.md research/DEPTH_PILOT.md || true
          git diff --cached --quiet || git commit -m "depth: derived queue metrics from Databento purchase"
          for i in 1 2 3 4 5; do
            git pull --rebase origin claude/hello-vc2ivo && git push origin claude/hello-vc2ivo && break
            sleep 5
          done
